# ${VAR:default} -> đọc biến môi trường nếu có, không thì dùng default. Khi deploy PHẢI set các biến
# DB_PASSWORD, JWT_SECRET, CHATBOT_API_KEY, INTERNAL_SECRET, VNPAY_* thay vì sửa file này.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=menswear_shop;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ===== JWT =====
# secret ký token, tối thiểu 256 bit cho HS256 -> deploy thật PHẢI đổi qua biến môi trường, không hardcode.
app.jwt.secret=${JWT_SECRET:NovaCart_DoAnTotNghiep_SuperSecretKey_ThayDoiKhiDeployThat_2026}
# access token sống 24h -- để dài cho dễ test, thực tế nên ngắn hơn + refresh token.
app.jwt.expiration-ms=86400000

# ===== VNPay (sandbox) =====
# Đăng ký merchant sandbox tại https://sandbox.vnpayment.vn/devreg/ để lấy vnp_TmnCode + vnp_HashSecret.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:5173/vnpay-result

# ===== Chuyển khoản ngân hàng (mã QR VietQR, xem VietQrService) =====
# BIN ngân hàng theo chuẩn VietQR (napas), vd Vietcombank = 970436, xem đủ danh sách tại vietqr.io.
shop.bank.bin=${SHOP_BANK_BIN:970436}
shop.bank.account-number=${SHOP_BANK_ACCOUNT_NUMBER:0123456789}
shop.bank.account-name=${SHOP_BANK_ACCOUNT_NAME:NOVACART}

# ===== VietMap Maps API (thay Google Maps Platform -- Google chặn key đăng ký từ Việt Nam từ
# 21/03/2022, xem VietMapService) =====
vietmap.api-key=${VIETMAP_API_KEY:829aa580cd2dc4ec42092296bd9f6f6ac460f6a7ecc0fd43}
# Toạ độ showroom/kho hàng -- điểm gốc để tính khoảng cách ship thật (mặc định trung tâm Hà Nội,
# ĐỔI LẠI cho đúng địa chỉ showroom thật trước khi dùng thật).
shop.origin.lat=${SHOP_ORIGIN_LAT:21.0285}
shop.origin.lng=${SHOP_ORIGIN_LNG:105.8542}

# ===== Chatbot tư vấn (RAG kit Node.js, thư mục chatbot/ trong repo này) =====
# Java chỉ đóng vai trò cầu nối: giấu API key của kit khỏi frontend + gắn userId thật từ JWT.
novacart.chatbot.api-base=http://localhost:3200
novacart.chatbot.api-key=${CHATBOT_API_KEY:4df0e2aebebb6200d6465e7febaac4af94c685dbddaf1ba6}
novacart.chatbot.namespace=novacart
# Secret riêng để kit gọi ngược vào GET /internal/kb/products khi đồng bộ -- phải khớp NOVACART_INTERNAL_SECRET trong chatbot/.env.
novacart.internal-secret=${INTERNAL_SECRET:b100e0b4234fefdc3afa2fee0331fb9ea69e6c011d3175fd}
