# ${VAR:default} -> đọc biến môi trường nếu có, không thì dùng default. Khi deploy PHẢI set các biến
# DB_PASSWORD, JWT_SECRET, CHATBOT_API_KEY, INTERNAL_SECRET, VNPAY_* thay vì sửa file này.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=menswear_shop;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ===== Upload ảnh sản phẩm (xem FileStorageService) =====
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# ===== JWT =====
# secret ký token, tối thiểu 256 bit cho HS256 -> deploy thật PHẢI đổi qua biến môi trường, không hardcode.
app.jwt.secret=${JWT_SECRET:NovaCart_DoAnTotNghiep_SuperSecretKey_ThayDoiKhiDeployThat_2026}
# access token sống 24h -- để dài cho dễ test, thực tế nên ngắn hơn + refresh token.
app.jwt.expiration-ms=86400000

# ===== Gửi email (đặt lại mật khẩu -- xem MailService) =====
# Gmail KHÔNG cho đăng nhập SMTP bằng mật khẩu thường. Phải bật Xác minh 2 bước rồi tạo "App password"
# 16 ký tự tại https://myaccount.google.com/apppasswords, và đặt vào biến môi trường:
#     MAIL_USERNAME=địa-chỉ-gmail-của-bạn@gmail.com
#     MAIL_PASSWORD=16-ky-tu-app-password-khong-co-dau-cach
# Để trống thì luồng quên mật khẩu trả lỗi RÕ RÀNG ("chưa cấu hình gửi email") chứ không im lặng nuốt --
# im lặng ở đây là tệ nhất: người dùng ngồi đợi mail không bao giờ tới mà không biết vì sao.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Không có timeout thì SMTP treo có thể giữ luồng web hàng phút liền.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Gốc URL của frontend -- dùng để dựng link đặt lại mật khẩu trong email.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Link đặt lại sống bao lâu. Ngắn để giảm thiệt hại nếu hộp thư bị người khác đọc được.
app.password-reset.expiration-minutes=30

# ===== VNPay (sandbox) =====
vnpay.tmn-code=${VNPAY_TMN_CODE:BZ1O9225}
vnpay.hash-secret=${VNPAY_HASH_SECRET:IMPTLMIXJRJEHUPFGPFJNIYEOUEXBNRD}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# vnp_ReturnUrl gửi CHO VNPay -- PHẢI là endpoint BACKEND (VNPayReturnController), vì đây là nơi verify
# chữ ký HMAC + set đơn hàng PAID. Trỏ nhầm sang FE (như trước) khiến bước verify không bao giờ chạy,
# đơn hàng mãi ở trạng thái UNPAID dù khách thanh toán thành công thật.
vnpay.callback-url=http://localhost:8080/api/vnpay/return
# Trang FE hiển thị kết quả cho khách -- VNPayReturnController redirect tới đây SAU KHI đã verify xong.
vnpay.return-url=http://localhost:5173/vnpay-result

