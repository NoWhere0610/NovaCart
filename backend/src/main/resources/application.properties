# ${VAR:default} -> đọc từ biến môi trường nếu có, không thì dùng giá trị mặc định sau dấu ":" (để
# local dev vẫn chạy được ngay không cần set gì thêm). Khi deploy thật, PHẢI set các biến môi trường
# này (DB_PASSWORD, JWT_SECRET, CHATBOT_API_KEY, INTERNAL_SECRET, VNPAY_*) thay vì sửa file này.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=menswear_shop;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ===== JWT =====
# secret dùng ký token, tối thiểu 256 bit (32 ký tự) cho thuật toán HS256 -> khi deploy thật PHẢI đổi
# và nên đưa ra biến môi trường (KHÔNG hardcode trong file này khi public code lên GitHub)
app.jwt.secret=${JWT_SECRET:NovaCart_DoAnTotNghiep_SuperSecretKey_ThayDoiKhiDeployThat_2026}
# access token sống 24h (86400000 ms) - đồ án nên để dài cho dễ test, thực tế nên 15-30 phút + refresh token
app.jwt.expiration-ms=86400000

# ===== VNPay (sandbox) =====
# Đăng ký tài khoản merchant sandbox tại https://sandbox.vnpayment.vn/devreg/
# để lấy vnp_TmnCode + vnp_HashSecret rồi điền vào đây.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:5173/vnpay-result

# ===== Chatbot tư vấn (RAG kit Node.js, thư mục chatbot/ trong repo này) =====
# Java chỉ đóng vai trò cầu nối: giấu API key của kit khỏi frontend + gắn userId thật từ JWT.
novacart.chatbot.api-base=http://localhost:3200
novacart.chatbot.api-key=${CHATBOT_API_KEY:4df0e2aebebb6200d6465e7febaac4af94c685dbddaf1ba6}
novacart.chatbot.namespace=novacart
# Secret RIÊNG (khác API key ở trên) để kit gọi NGƯỢC vào GET /internal/kb/products khi đồng bộ sản
# phẩm mỗi ngày -- PHẢI khớp NOVACART_INTERNAL_SECRET trong chatbot/.env (trong repo này)
novacart.internal-secret=${INTERNAL_SECRET:b100e0b4234fefdc3afa2fee0331fb9ea69e6c011d3175fd}
